[package]
name = "lsl-sys"
version = "0.2.0"
authors = ["Intheon <contact@intheon.io>", "Christian Kothe <christian.kothe@intheon.io>"]
edition = "2021"
description = "Low-level bindings to the system liblsl library (lab streaming layer)."
repository = "https://github.com/SiFiLabs/liblsl-rust"
publish = false
license = "MIT"
keywords = ["lsl", "ffi"]
categories = ["external-ffi-bindings"]
links = "lsl"

[build-dependencies]
cmake = "0.1.44"

[lib]
# the generated docs contain C code blocks copied from the liblsl headers
doctest = false
